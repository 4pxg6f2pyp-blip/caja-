<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Una columna angosta tipo app de iPhone: tarjetas agrupadas sobre fondo gris y barra de pestañas fija abajo. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --fill:#ececf1; --seg-on:#ffffff;
  --fg:#17171a; --fg2:#6b6b73; --fg3:#b3b3ba; --line:#e0e0e6;
  --accent:#0a74f0; --on-accent:#ffffff;
  --good:#167a3c; --warn:#9a4a07; --bad:#c4261c;
  --good-soft:#e1f5e9; --warn-soft:#fdf0dc; --bad-soft:#fde6e4;
  --bar:rgba(247,247,250,.88); --scrim:rgba(0,0,0,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --seg-on:#636366;
    --fg:#f5f5f7; --fg2:#9b9ba3; --fg3:#5a5a60; --line:#2e2e32;
    --accent:#0a84ff; --on-accent:#ffffff;
    --good:#32d74b; --warn:#ff9f0a; --bad:#ff6961;
    --good-soft:#10301a; --warn-soft:#38260a; --bad-soft:#3e1714;
    --bar:rgba(28,28,30,.88); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --seg-on:#636366;
  --fg:#f5f5f7; --fg2:#9b9ba3; --fg3:#5a5a60; --line:#2e2e32;
  --accent:#0a84ff; --on-accent:#ffffff;
  --good:#32d74b; --warn:#ff9f0a; --bad:#ff6961;
  --good-soft:#10301a; --warn-soft:#38260a; --bad-soft:#3e1714;
  --bar:rgba(28,28,30,.88); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(100px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
.wrap{max-width:560px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Encabezados */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 0 4px}
.eyebrow{font-size:13px;color:var(--fg2);text-transform:capitalize}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.icon-btn.solid{background:var(--accent);color:var(--on-accent)}

/* Tarjetas */
.card{background:var(--surface);border-radius:14px;padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.muted{color:var(--fg2)}
.small{font-size:13px}
.hero .label{font-size:13px;color:var(--fg2)}
.hero .big{font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.hero .big.neg{color:var(--bad)}
.hero .sub{font-size:14px;color:var(--fg2);text-wrap:pretty}
.hero .sub strong{color:var(--fg)}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:600;font-size:15px;background:var(--fill);color:var(--fg)}
.btn-row .btn{flex:1}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.link{background:none;border:0;padding:6px 2px;color:var(--accent);font-size:16px}
.link.strong{font-weight:600}

/* Avisos */
.note{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;background:var(--fill);color:var(--fg)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note .btn{margin-top:8px;min-height:36px;padding:6px 12px;font-size:14px}
.note p+p{margin-top:6px}

/* Barras de avance */
.line{font-size:15px;margin-bottom:8px}
.line strong{font-size:22px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar.over>i{background:var(--bad)}
.card .bar+p{margin-top:8px}

/* Filas */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.mov{grid-template-columns:minmax(0,1fr) auto}
.check{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);display:grid;place-items:center;color:#fff}
.circle .ic{width:15px;height:15px;stroke-width:3;display:none}
.check[aria-pressed="true"] .circle{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"] .circle .ic{display:block}
.flag{width:44px;height:44px;display:grid;place-items:center;color:var(--fg2)}
.main{background:none;border:0;text-align:left;padding:11px 4px;min-width:0;display:block;width:100%}
.main .t{display:block;font-weight:500;overflow-wrap:anywhere}
.main .s{display:block;font-size:13px;color:var(--fg2);margin-top:1px;overflow-wrap:anywhere}
.row.done .t{color:var(--fg2);text-decoration:line-through}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
.amt.in{color:var(--good)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--fill);color:var(--fg2);margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 4px 0;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.ghead .net{font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.gsub{padding:0 4px;font-size:12px;color:var(--fg2);margin-top:-6px}
.empty{padding:24px 8px;text-align:center;color:var(--fg2);font-size:15px;text-wrap:balance}

/* Resumen de movimientos */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:left}
.stats span{display:block;font-size:12px;color:var(--fg2)}
.stats strong{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats .pos{color:var(--good)}
.cats li{padding:6px 0}
.catline{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}

/* Segmentado */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:14px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:4px 0;min-height:48px;font-size:11px;font-weight:500;color:var(--fg2)}
.tab[aria-current="page"]{color:var(--accent)}

/* Hojas (formularios) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 0 4px}
.sheet-head h2{text-align:center}
.sheet-head .link:first-child{justify-self:start}
.sheet-head .link:last-child{justify-self:end}
.amount{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0}
.amount span{font-size:34px;font-weight:700;color:var(--fg2)}
.amount input{font:700 44px var(--font);letter-spacing:-.02em;border:0;background:transparent;color:var(--fg);text-align:center;width:min(60%,260px);min-width:0;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;padding:0 4px;margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:99px;padding:8px 14px;background:var(--surface);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.field{background:var(--surface);border-radius:12px;padding:0 14px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:48px}
.frow:first-child{border-top:0}
.frow label{flex:none;max-width:55%}
.frow input,.frow select{flex:1;min-width:0;text-align:right;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:0}
.frow select{text-align-last:right}
.frow input[type="date"]{min-height:24px}
.err{color:var(--bad);font-size:14px;padding:0 4px}
.hint{font-size:13px;color:var(--fg2);padding:0 4px;text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:110px;border:0;border-radius:12px;background:var(--surface);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,monospace;padding:12px;resize:vertical}
.foot{text-align:center;font-size:12px;color:var(--fg2);padding:4px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
</style>

<div class="wrap">
  <section id="screen-resumen" class="screen" aria-label="Resumen"></section>
  <section id="screen-movimientos" class="screen" aria-label="Movimientos" hidden></section>

</div>

</nav>

<script>
(function(){
'use strict';
var NOW=function(){return new Date()};

/*LOGIC_START*/
var DAY=864e5;
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(NOW())}
function weekStart(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/DAY)}
function isMoney(it){return it.kind==='ingreso'||it.kind==='deuda'||it.kind==='anticipo'||it.kind==='gasto'}
function signed(it){return it.kind==='ingreso'?it.amount:-it.amount}

function seed(){
  var rows=[
    ['2026-11-24','Avisar a tu jefe que pedirás días de descanso a finales de enero',0,'tarea'],
    ['2026-11-24','Pagar a tu amiga',350,'deuda',{due:'2026-11-24'}],
    ['2026-11-28','Sueldo #1',1900,'ingreso',{cat:'Sueldo'}],
    ['2026-11-28','Pagar a la otra amiga',100,'deuda'],
    ['2026-11-28','Gym de diciembre',550,'gasto',{cat:'Gym'}],
    ['2026-12-05','Sueldo #2',1900,'ingreso',{cat:'Sueldo'}],
    ['2026-12-12','Sueldo #3',1900,'ingreso',{cat:'Sueldo'}],
    ['2026-12-12','Pagar los 200 (amigo o tu mamá)',200,'deuda'],
    ['2026-12-19','Sueldo #4',1900,'ingreso',{cat:'Sueldo'}],
    ['2026-12-19','Regalo de Navidad para ti (camisa y tenis)',2000,'gasto',{cat:'Para mí'}],
    ['2026-12-26','Sueldo #5',1900,'ingreso',{cat:'Sueldo'}],
    ['2027-01-02','Sueldo #6',1900,'ingreso',{cat:'Sueldo'}],
    ['2027-01-02','Gym de enero',550,'gasto',{cat:'Gym'}],
    ['2027-01-09','Sueldo #7',1900,'ingreso',{cat:'Sueldo'}],
    ['2027-01-09','Apartar el lugar de la pedida (50%)',1200,'anticipo',{goal:1,cat:'Pedida'}],
    ['2027-01-09','Apartar el collar Tiffany (50%)',525,'anticipo',{goal:1,cat:'Pedida'}],
    ['2027-01-16','Sueldo #8',1900,'ingreso',{cat:'Sueldo'}],
    ['2027-01-16','Apartar las flores (50%)',600,'anticipo',{goal:1,cat:'Pedida'}],
    ['2027-01-23','Sueldo #9',1900,'ingreso',{cat:'Sueldo'}],
    ['2027-01-23','Liquidar el collar',524,'gasto',{goal:1,cat:'Pedida'}],
    ['2027-01-23','Confirmar tus días libres con tu jefe',0,'tarea'],
    ['2027-01-24','Vanessa llega a Guadalajara',0,'hito'],
    ['2027-01-27','Confirmar horario con el lugar y las flores',0,'tarea'],
    ['2027-01-29','Recoger el collar',0,'tarea'],
    ['2027-01-30','Pedida: liquidar el resto del lugar',1199,'gasto',{goal:1,cat:'Pedida'}],
    ['2027-01-30','Pedida: pagar el resto de las flores',600,'gasto',{goal:1,cat:'Pedida'}]
  ];
  return {
    v:1, updatedAt:0,
    settings:{startBalance:1400,startDate:'2026-11-24',weeklyBudget:600,buffer:200,goalDate:'2027-01-30'},
    plan:rows.map(function(r,i){
      var o=r[4]||{};
      return {id:'s'+pad(i+1),date:r[0],title:r[1],amount:r[2],kind:r[3],
        category:o.cat||(r[3]==='deuda'?'Deudas':(r[3]==='ingreso'?'Sueldo':'Otros')),
        goal:!!o.goal,due:o.due||'',paid:false};
    }),
    tx:[]
  };
}
function normalize(s){
  var c=JSON.parse(JSON.stringify(s)),d=seed();
  return {v:1,updatedAt:+c.updatedAt||0,
    settings:Object.assign({},d.settings,c.settings||{}),
    plan:Array.isArray(c.plan)?c.plan:d.plan,
    tx:Array.isArray(c.tx)?c.tx:[]};
}
function balanceNow(st){
  var b=st.settings.startBalance;
  st.tx.forEach(function(x){b+=x.type==='ingreso'?x.amount:-x.amount});
  return b;
}
function spentThisWeek(st){
  var a=weekStart(today()),b=addDays(a,6);
  return st.tx.reduce(function(s,x){return s+(x.type==='gasto'&&!x.planId&&x.date>=a&&x.date<=b?x.amount:0)},0);
}
function goalProgress(st){
  var tot=0,paid=0;
  st.plan.forEach(function(it){if(it.goal&&isMoney(it)){tot+=it.amount;if(it.paid)paid+=it.amount}});
  return {tot:tot,paid:paid};
}
/* Proyecta tu saldo día por día: pagos pendientes del plan + gasto suelto de cada semana (se descuenta el lunes, a lo seguro). */
function simulate(st,o){
  o=o||{};
  var t=today(),S=st.settings;
  var budget=o.budget!=null?o.budget:S.weeklyBudget;
  var ev={},end=S.goalDate>t?S.goalDate:t;
  function add(d,x){if(d<t)d=t;ev[d]=(ev[d]||0)+x;if(d>end)end=d}
  st.plan.forEach(function(it){
    if(it.paid||!isMoney(it)||it.id===o.excludeId)return;
    add(it.date,signed(it));
  });
  (o.extra||[]).forEach(function(e){add(e.date,e.delta)});
  var left=Math.max(0,budget-spentThisWeek(st));
  if(left>0)add(t,-left);
  for(var m=addDays(weekStart(t),7);m<=end;m=addDays(m,7))add(m,-budget);
  var bal=balanceNow(st),min=Infinity,minDate=t,series=[];
  for(var d=t;d<=end;d=addDays(d,1)){
    bal+=ev[d]||0;
    series.push({date:d,bal:bal});
    if(bal<min){min=bal;minDate=d}
  }
  return {series:series,min:min,minDate:minDate,end:end,final:series[series.length-1].bal};
}
/* Primer día en que puedes pagar sin que tu saldo vuelva a bajar de tu colchón. */
function suggestDate(st,amount,o){
  o=o||{};
  var t=today(),buffer=st.settings.buffer;
  var base=simulate(st,{excludeId:o.excludeId});
  for(var d=t;d<=base.end;d=addDays(d,1)){
    var s=simulate(st,{excludeId:o.excludeId,extra:[{date:d,delta:-amount}]});
    var idx=0;
    for(var i=0;i<s.series.length;i++){if(s.series[i].date===d){idx=i;break}}
    var low=Infinity;
    for(var j=idx;j<s.series.length;j++){if(s.series[j].bal<low)low=s.series[j].bal}
    if(low>=buffer)return {date:d,low:low,late:!!(o.due&&d>o.due)};
  }
  return null;
}
function maxBudget(st){
  for(var b=3000;b>=0;b-=10){
    if(simulate(st,{budget:b}).min>=st.settings.buffer)return b;
  }
  return 0;
}
function level(min,st){return min<0?'bad':(min<st.settings.buffer?'warn':'good')}
/*LOGIC_END*/

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('es-MX',{maximumFractionDigits:0});
var money=function(n,sign){var r=Math.round(n);return (r<0?'−':(sign&&r>0?'+':''))+'$'+nf.format(Math.abs(r))};
var fmtShort=new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short'});
var fmtLong=new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'});
var fmtDM=new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short'});
var dayLabel=function(s){return fmtShort.format(parse(s)).replace(/\./g,'')};
var dmLabel=function(s){return fmtDM.format(parse(s)).replace(/\./g,'')};
var num=function(v){var n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
function rel(s){
  var t=today();
  if(s===t)return 'Hoy';
  if(s===addDays(t,1))return 'Mañana';
  if(s===addDays(t,-1))return 'Ayer';
  return dayLabel(s);
}

  plus:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',

var CAT_OUT=['Comida','Salidas','Transporte','Gym','Para mí','Pedida','Deudas','Otros'];
var CAT_IN=['Sueldo','Tap Onda','Otro'];
var KIND_LABEL={ingreso:'Ingreso',deuda:'Deuda',anticipo:'Anticipo',gasto:'Pago',tarea:'Tarea',hito:'Hito'};
var TABS=['resumen','movimientos','plan'];
var KEY='cajamora:v1';

/* ---------- Estado y guardado ---------- */
var fresh=false;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.plan)){fresh=false;return normalize(s)}}
  }catch(e){}
  fresh=true;
  return seed();
}
var state=load();
var ui={tab:'resumen',range:'mes',filter:'pend',sheet:null};
var syncState='local',docRef=null,saving=false,dirty=false,saveTimer=null,seeded=false;

function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function touch(){state.updatedAt=Date.now();persistLocal();scheduleCloud()}
function scheduleCloud(){
  if(!docRef)return;
  dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(saving||!docRef||!dirty)return;
  saving=true;dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(state)));setSync('cloud')}
  catch(e){setSync('error')}
  saving=false;
  if(dirty)scheduleCloud();
}
function syncText(){
  if(syncState==='cloud')return 'Tus datos están guardados en tu cuenta y en este teléfono.';
  if(syncState==='connecting')return 'Sincronizando con tu cuenta…';
  if(syncState==='error')return 'No se pudo conectar con tu cuenta. Tus datos siguen guardados en este teléfono.';
  return 'Tus datos están guardados en este teléfono.';
}
function setSync(s){
  syncState=s;
  var a=$('#sync-line');if(a)a.textContent=syncText();
  var b=$('#sync-line2');if(b)b.textContent=syncText();
}
async function initCloud(){
  try{
    var res=await Promise.all([claude.use('db'),claude.use('user')]);
    var db=res[0],user=res[1];
    if(!db||!user){setSync('local');return}
    var id=await user.id();
    if(!id){setSync('local');return}
    docRef=db.doc('data/users/'+id+'/state');
    setSync('connecting');
    var timer=setTimeout(function(){if(syncState==='connecting')setSync('error')},10000);
    docRef.onSnapshot(function(snap){
      var def=!snap.metadata.fromCache;
      if(def)clearTimeout(timer);
      if(!snap.exists){
        if(def){fresh=false;if(!seeded){seeded=true;scheduleCloud()}}
        return;
      }
      var remote=snap.data()||{};
      if((+remote.updatedAt||0)>(state.updatedAt||0)){
        state=normalize(remote);persistLocal();fresh=false;renderAll();
      }
      if(def){fresh=false;if(!snap.metadata.hasPendingWrites&&syncState!=='error')setSync('cloud')}
    },function(){setSync('error')});
  }catch(e){setSync('local')}
}
function guard(){
  if(fresh&&syncState==='connecting'){toast('Cargando tus datos. Intenta en unos segundos.');return false}
  return true;
}

var toastTimer=null;
function toast(msg){
  var el=$('#toast');el.textContent=msg;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2600);
}

/* ---------- Piezas de pantalla ---------- */
function statusNote(){
  var st=state,sim=simulate(st),S=st.settings,lvl=level(sim.min,st),maxB=maxBudget(st);
  var head,tip;
  if(lvl==='good')head='Vas bien. Tu punto más bajo será '+money(sim.min)+' el '+dayLabel(sim.minDate)+'.';
  else if(lvl==='warn')head='Va justo. Tu saldo baja a '+money(sim.min)+' el '+dayLabel(sim.minDate)+', debajo de tu colchón de '+money(S.buffer)+'.';
  else head='Ojo: te quedas sin dinero el '+dayLabel(sim.minDate)+' ('+money(sim.min)+'). Mueve un pago o baja tu gasto suelto.';
  if(maxB>=S.weeklyBudget)tip='Podrías gastar hasta '+money(maxB)+' por semana en lo suelto sin bajar de tu colchón.';
  else tip='Para no bajar de tu colchón, gasta '+money(maxB)+' por semana o menos en lo suelto.';
  return '<div class="note '+lvl+'"><p><strong>'+esc(head)+'</strong></p><p>'+esc(tip)+'</p></div>';
}
function tagFor(it){
  if(it.paid||it.kind==='hito')return '';
  var t=today();
  if(it.date<t)return '<span class="tag bad">Vencido</span>';
  if(it.date===t)return '<span class="tag warn">Hoy</span>';
  return '';
}
function planRow(it){
  var lead=it.kind==='hito'
    ?'<span class="flag" aria-hidden="true">'+ICON.flag+'</span>'
    :'<button class="check" data-act="toggle-plan" data-id="'+esc(it.id)+'" aria-pressed="'+(it.paid?'true':'false')+'" aria-label="'+(it.paid?'Marcar como pendiente':'Marcar como hecho')+'"><span class="circle">'+ICON.check+'</span></button>';
  var sub=rel(it.date)+' · '+KIND_LABEL[it.kind];
  if(it.due&&!it.paid&&it.due!==it.date)sub+=' · vence '+dayLabel(it.due);
  var amt=isMoney(it)?'<span class="amt'+(it.kind==='ingreso'?' in':'')+'">'+money(signed(it),true)+'</span>':'<span></span>';
  return '<li class="row'+(it.paid?' done':'')+'">'+lead+
    '<button class="main" data-act="edit-plan" data-id="'+esc(it.id)+'"><span class="t">'+esc(it.title)+tagFor(it)+'</span><span class="s">'+esc(sub)+'</span></button>'+amt+'</li>';
}

/* ---------- Resumen ---------- */
function renderResumen(){
  var st=state,S=st.settings,t=today(),sim=simulate(st),bal=balanceNow(st);
  var atGoal=(sim.series.filter(function(p){return p.date===S.goalDate})[0]||sim.series[sim.series.length-1]).bal;
  var spent=spentThisWeek(st),left=S.weeklyBudget-spent;
  var daysLeft=diffDays(t,addDays(weekStart(t),6))+1;
  var pct=S.weeklyBudget>0?Math.min(100,spent/S.weeklyBudget*100):0;
  var gp=goalProgress(st),gpct=gp.tot>0?gp.paid/gp.tot*100:0;
  var dleft=diffDays(t,S.goalDate);
  var nextGoal=st.plan.filter(function(i){return i.goal&&isMoney(i)&&!i.paid}).sort(function(a,b){return a.date.localeCompare(b.date)})[0];
  var next=st.plan.filter(function(i){return !i.paid&&i.kind!=='hito'}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,4);
  $('#screen-resumen').innerHTML=
    '<header class="top"><div><p class="eyebrow">'+esc(fmtLong.format(parse(t)))+'</p><h1>Resumen</h1></div>'+
    '<button class="icon-btn" data-act="open-settings" aria-label="Ajustes">'+ICON.gear+'</button></header>'+
    '<section class="card hero"><p class="label">Saldo actual</p>'+
    '<p class="big'+(bal<0?' neg':'')+'">'+money(bal)+'</p>'+
    '<p class="sub">Al '+esc(dayLabel(S.goalDate))+', con todo el plan pagado y tu gasto suelto, te quedarían <strong>'+money(atGoal)+'</strong>.</p>'+
    '<div class="btn-row"><button class="btn" data-act="add-mov" data-v="gasto">'+ICON.minus+'Gasto</button>'+
    '<button class="btn primary" data-act="add-mov" data-v="ingreso">'+ICON.plus+'Ingreso</button></div></section>'+
    statusNote()+
    '<section class="card"><div class="card-head"><h2>Gasto suelto de la semana</h2><span class="muted small">'+daysLeft+(daysLeft===1?' día':' días')+'</span></div>'+
    '<p class="line"><strong>'+money(spent)+'</strong> <span class="muted">de '+money(S.weeklyBudget)+'</span></p>'+
    '<div class="bar'+(left<0?' over':'')+'" role="progressbar" aria-label="Gasto suelto" aria-valuemin="0" aria-valuemax="'+S.weeklyBudget+'" aria-valuenow="'+Math.round(spent)+'"><i style="width:'+pct+'%"></i></div>'+
    '<p class="muted small">'+(left>=0?'Te quedan '+money(left)+' hasta el domingo.':'Te pasaste '+money(-left)+' esta semana.')+'</p></section>'+
    '<section class="card"><div class="card-head"><h2>Meta: la pedida</h2><span class="muted small">'+(dleft>0?'faltan '+dleft+' días':(dleft===0?'es hoy':'ya pasó la fecha'))+'</span></div>'+
    '<p class="line"><strong>'+money(gp.paid)+'</strong> <span class="muted">de '+money(gp.tot)+' pagados</span></p>'+
    '<div class="bar" role="progressbar" aria-label="Avance de la pedida" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(gpct)+'"><i style="width:'+gpct+'%"></i></div>'+
    '<p class="muted small">'+(nextGoal?'Sigue: '+esc(nextGoal.title)+', '+esc(dayLabel(nextGoal.date))+', '+money(nextGoal.amount)+'.':'Todo lo de la pedida está pagado.')+'</p></section>'+
    '<section class="card"><div class="card-head"><h2>Lo que sigue</h2><button class="link" data-act="tab" data-v="plan">Ver plan</button></div>'+
    (next.length?'<ul>'+next.map(planRow).join('')+'</ul>':'<p class="empty">No tienes nada pendiente en el plan.</p>')+'</section>'+
    '<p class="foot" id="sync-line">'+esc(syncText())+'</p>';
}

/* ---------- Movimientos ---------- */
function renderMov(){
  var st=state,t=today(),from=null;
  if(ui.range==='semana')from=weekStart(t);
  else if(ui.range==='mes')from=t.slice(0,8)+'01';
  var list=st.tx.filter(function(x){return !from||x.date>=from}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
  var inc=0,out=0,cats={};
  list.forEach(function(x){if(x.type==='ingreso')inc+=x.amount;else{out+=x.amount;cats[x.category]=(cats[x.category]||0)+x.amount}});
  var catRows=Object.keys(cats).map(function(k){return [k,cats[k]]}).sort(function(a,b){return b[1]-a[1]});
  var seg=[['semana','Semana'],['mes','Mes'],['todo','Todo']].map(function(r){
    return '<button data-act="range" data-v="'+r[0]+'" aria-pressed="'+(ui.range===r[0])+'">'+r[1]+'</button>';
  }).join('');
  var groups='',cur='';
  list.forEach(function(x){
    if(x.date!==cur){
      if(cur)groups+='</ul></section>';
      cur=x.date;
      groups+='<p class="ghead"><span>'+esc(rel(x.date))+(rel(x.date)===dayLabel(x.date)?'':' · '+esc(dayLabel(x.date)))+'</span></p><section class="card"><ul>';
    }
    groups+='<li class="row mov"><button class="main" data-act="edit-mov" data-id="'+esc(x.id)+'"><span class="t">'+esc(x.category)+(x.planId?'<span class="tag">Plan</span>':'')+'</span><span class="s">'+esc(x.why||'Sin motivo')+'</span></button>'+
      '<span class="amt'+(x.type==='ingreso'?' in':'')+'">'+money(x.type==='ingreso'?x.amount:-x.amount,true)+'</span></li>';
  });
  if(cur)groups+='</ul></section>';
  $('#screen-movimientos').innerHTML=
    '<header class="top"><div><p class="eyebrow">Lo que entra y lo que sale</p><h1>Movimientos</h1></div>'+
    '<button class="icon-btn solid" data-act="add-mov" data-v="gasto" aria-label="Agregar movimiento">'+ICON.plus+'</button></header>'+
    '<div class="seg" role="group" aria-label="Periodo">'+seg+'</div>'+
    '<section class="card"><div class="stats"><div><span>Entró</span><strong class="pos">'+money(inc,true)+'</strong></div>'+
    '<div><span>Salió</span><strong>'+money(-out)+'</strong></div>'+
    '<div><span>Neto</span><strong>'+money(inc-out,true)+'</strong></div></div></section>'+
    (catRows.length
      ?'<section class="card"><div class="card-head"><h2>En qué gastas</h2><span class="muted small">'+money(out)+'</span></div><ul class="cats">'+
        catRows.map(function(r){var p=out>0?r[1]/out*100:0;
          return '<li><div class="catline"><span>'+esc(r[0])+'</span><span class="muted">'+Math.round(p)+'% · '+money(r[1])+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></li>';
        }).join('')+'</ul></section>'
      :'')+
    (list.length?groups:'<p class="empty">Todavía no hay movimientos en este periodo. Toca + para registrar tu primer gasto y anota por qué lo hiciste.</p>');
}

/* ---------- Plan ---------- */
function weekRange(ws){
  var a=parse(ws),b=parse(addDays(ws,6));
  if(a.getMonth()===b.getMonth())return a.getDate()+' – '+b.getDate()+' '+dmLabel(ws).split(' ').slice(1).join(' ');
  return dmLabel(ws)+' – '+dmLabel(addDays(ws,6));
}
function renderPlan(){
  var st=state,t=today(),sim=simulate(st),bal={};
  sim.series.forEach(function(p){bal[p.date]=p.bal});
  var items=st.plan.slice().sort(function(a,b){
    return a.date.localeCompare(b.date)||((a.kind==='ingreso'?-1:1)-(b.kind==='ingreso'?-1:1));
  }).filter(function(i){return ui.filter==='todo'||(ui.filter==='pend'?!i.paid:i.paid)});
  var seg=[['pend','Pendiente'],['hecho','Hecho'],['todo','Todo']].map(function(r){
    return '<button data-act="filter" data-v="'+r[0]+'" aria-pressed="'+(ui.filter===r[0])+'">'+r[1]+'</button>';
  }).join('');
  var order=[],map={};
  items.forEach(function(i){var w=weekStart(i.date);if(!map[w]){map[w]=[];order.push(w)}map[w].push(i)});
  var thisWeek=weekStart(t);
  var html=order.map(function(w){
    var arr=map[w],net=0;
    arr.forEach(function(i){if(isMoney(i))net+=signed(i)});
    var endDay=addDays(w,6),est=bal[endDay<sim.end?endDay:sim.end];
    var showEst=ui.filter!=='hecho'&&endDay>=t&&est!=null;
    return '<p class="ghead"><span>'+esc(weekRange(w))+(w===thisWeek?' · esta semana':'')+'</span><span class="net">'+(net?money(net,true):'')+'</span></p>'+
      (showEst?'<p class="gsub">Saldo estimado al cerrar la semana: '+money(est)+'</p>':'')+
      '<section class="card"><ul>'+arr.map(planRow).join('')+'</ul></section>';
  }).join('');
  $('#screen-plan').innerHTML=
    '<header class="top"><div><p class="eyebrow">Deudas, anticipos y sueldos</p><h1>Plan</h1></div>'+
    '<button class="icon-btn solid" data-act="add-plan" aria-label="Agregar al plan">'+ICON.plus+'</button></header>'+
    statusNote()+
    '<div class="seg" role="group" aria-label="Filtro">'+seg+'</div>'+
    (items.length?html:'<p class="empty">'+(ui.filter==='hecho'?'Aún no has marcado nada como hecho.':'No tienes nada pendiente. Toca + para agregar una deuda o un pago.')+'</p>');
}
function renderAll(){renderResumen();renderMov();renderPlan()}

/* ---------- Hojas ---------- */
function panel(html){
  $('#sheet-panel').innerHTML=html;
  $('#sheet').hidden=false;
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('#sheet').hidden=true;ui.sheet=null;
  document.body.style.overflow='';
}
function head(title,saveAct,saveLabel){
  return '<div class="sheet-head"><button class="link" data-act="close-sheet">Cancelar</button><h2>'+esc(title)+'</h2>'+
    '<button class="link strong" data-act="'+saveAct+'">'+saveLabel+'</button></div>';
}
function showErr(msg){var e=$('#sheet-err');if(e){e.textContent=msg;e.hidden=false}}

/* Movimiento */
function openMov(id,type){
  var tx=id?state.tx.filter(function(x){return x.id===id})[0]:null;
  ui.sheet={kind:'mov',id:id||null,type:tx?tx.type:(type||'gasto'),cat:tx?tx.category:null};
  drawMov({amount:tx?String(tx.amount):'',why:tx?tx.why:'',date:tx?tx.date:today()});
  if(!tx){var f=$('#m-amount');if(f)f.focus()}
}
function readMov(){
  return {amount:$('#m-amount').value,why:$('#m-why').value,date:$('#m-date').value};
}
function drawMov(v){
  var sh=ui.sheet,cats=sh.type==='gasto'?CAT_OUT:CAT_IN;
  if(cats.indexOf(sh.cat)<0)sh.cat=cats[0];
  var chips=cats.map(function(c){return '<button class="chip" data-act="mov-cat" data-v="'+esc(c)+'" aria-pressed="'+(sh.cat===c)+'">'+esc(c)+'</button>'}).join('');
  panel(head(sh.id?'Editar movimiento':'Nuevo movimiento','save-mov','Guardar')+
    '<div class="seg" role="group" aria-label="Tipo"><button data-act="mov-type" data-v="gasto" aria-pressed="'+(sh.type==='gasto')+'">Gasto</button><button data-act="mov-type" data-v="ingreso" aria-pressed="'+(sh.type==='ingreso')+'">Ingreso</button></div>'+
    '<div class="amount"><span>$</span><input id="m-amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Monto" value="'+esc(v.amount)+'"></div>'+
    '<p class="lbl">Categoría</p><div class="chips">'+chips+'</div>'+
    '<div class="field"><div class="frow"><label for="m-why">¿Por qué?</label><input id="m-why" autocomplete="off" placeholder="Ej. salida con amigos" value="'+esc(v.why)+'"></div>'+
    '<div class="frow"><label for="m-date">Fecha</label><input id="m-date" type="date" value="'+esc(v.date)+'"></div></div>'+
    '<p class="err" id="sheet-err" hidden></p>'+
    (sh.id?'<button class="btn danger wide" data-act="del-mov">Eliminar movimiento</button>':''));
}
function saveMov(){
  if(!guard())return;
  var sh=ui.sheet,v=readMov(),amt=num(v.amount);
  if(!(amt>0)){showErr('Escribe un monto mayor a cero.');$('#m-amount').focus();return}
  if(!v.date){showErr('Elige una fecha.');return}
  var rec={type:sh.type,amount:amt,category:sh.cat,why:v.why.trim(),date:v.date};
  if(sh.id){
    var tx=state.tx.filter(function(x){return x.id===sh.id})[0];
    if(tx)Object.assign(tx,rec);
  }else{
    state.tx.push(Object.assign({id:uid()},rec));
  }
  touch();closeSheet();renderAll();
  toast(sh.id?'Movimiento actualizado':(rec.type==='gasto'?'Gasto registrado: ':'Ingreso registrado: ')+money(rec.type==='gasto'?-amt:amt,true));
}
var armed=null;
function confirmTap(btn,label,fn){
  if(armed===btn){armed=null;fn();return}
  armed=btn;btn.dataset.label=btn.textContent;btn.textContent=label;
  setTimeout(function(){if(armed===btn){armed=null;if(btn.isConnected)btn.textContent=btn.dataset.label}},3500);
}
function delMov(){
  if(!guard())return;
  var id=ui.sheet.id,tx=state.tx.filter(function(x){return x.id===id})[0];
  if(!tx)return;
  if(tx.planId){
    var p=state.plan.filter(function(x){return x.id===tx.planId})[0];
    if(p){p.paid=false;delete p.paidOn}
  }
  state.tx=state.tx.filter(function(x){return x.id!==id});
  touch();closeSheet();renderAll();toast('Movimiento eliminado');
}

/* Plan: marcar, editar, agregar */
function syncTx(it){
  var old=state.tx.filter(function(x){return x.planId===it.id})[0];
  state.tx=state.tx.filter(function(x){return x.planId!==it.id});
  if(it.paid&&isMoney(it)){
    state.tx.push({id:old?old.id:uid(),date:old?old.date:today(),type:it.kind==='ingreso'?'ingreso':'gasto',amount:it.amount,category:it.category||'Otros',why:it.title,planId:it.id});
  }
}
function togglePlan(id){
  var it=state.plan.filter(function(x){return x.id===id})[0];
  if(!it)return;
  if(!it.paid){
    it.paid=true;it.paidOn=today();syncTx(it);
    toast(isMoney(it)?'Registrado: '+it.title+' '+money(signed(it),true):'Listo: '+it.title);
  }else{
    it.paid=false;delete it.paidOn;syncTx(it);
    toast('Marcado como pendiente');
  }
  touch();renderAll();
}
function uiKind(k){return k==='anticipo'?'gasto':(k==='hito'?'tarea':k)}
function openPlan(id){
  var it=id?state.plan.filter(function(x){return x.id===id})[0]:null;
  ui.sheet={kind:'plan',id:id||null,k:it?uiKind(it.kind):'deuda',orig:it?it.kind:null,cat:it?it.category:null,paid:it?it.paid:false,sugg:null};
  drawPlan({title:it?it.title:'',amount:it&&it.amount?String(it.amount):'',date:it?it.date:today(),due:it&&it.due?it.due:''});
  updateSugg();
}
function readPlan(){
  return {title:$('#p-title').value,amount:$('#p-amount')?$('#p-amount').value:'',date:$('#p-date').value,due:$('#p-due')?$('#p-due').value:''};
}
function drawPlan(v){
  var sh=ui.sheet,k=sh.k;
  var kinds=[['deuda','Deuda'],['gasto','Pago'],['ingreso','Ingreso'],['tarea','Tarea']].map(function(r){
    return '<button data-act="plan-kind" data-v="'+r[0]+'" aria-pressed="'+(k===r[0])+'">'+r[1]+'</button>';
  }).join('');
  var money_=k!=='tarea';
  var cats=k==='ingreso'?CAT_IN:(k==='deuda'?['Deudas']:CAT_OUT);
  if(cats.indexOf(sh.cat)<0)sh.cat=cats[0];
  var catRow=(k==='gasto'||k==='ingreso')
    ?'<div class="frow"><label for="p-cat">Categoría</label><select id="p-cat">'+cats.map(function(c){return '<option'+(c===sh.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>':'';
  var dateLabel=k==='ingreso'?'Cobras el':(k==='tarea'?'Fecha':'Pagar el');
  panel(head(sh.id?'Editar del plan':'Agregar al plan','save-plan','Guardar')+
    '<div class="seg" role="group" aria-label="Tipo">'+kinds+'</div>'+
    '<div class="field"><div class="frow"><label for="p-title">Nombre</label><input id="p-title" autocomplete="off" placeholder="Ej. Deuda con Ana" value="'+esc(v.title)+'"></div>'+
    (money_?'<div class="frow"><label for="p-amount">Monto</label><input id="p-amount" inputmode="decimal" autocomplete="off" placeholder="$0" value="'+esc(v.amount)+'"></div>':'')+
    catRow+
    '<div class="frow"><label for="p-date">'+dateLabel+'</label><input id="p-date" type="date" value="'+esc(v.date)+'"></div>'+
    (k==='deuda'?'<div class="frow"><label for="p-due">Vence (opcional)</label><input id="p-due" type="date" value="'+esc(v.due)+'"></div>':'')+
    '</div>'+
    '<div id="p-sugg" class="note" hidden></div>'+
    '<p class="err" id="sheet-err" hidden></p>'+
    (sh.id?'<button class="btn danger wide" data-act="del-plan">Eliminar del plan</button>':''));
}
function updateSugg(){
  var box=$('#p-sugg'),sh=ui.sheet;
  if(!box||!sh||sh.kind!=='plan')return;
  if((sh.k!=='deuda'&&sh.k!=='gasto')||sh.paid){box.hidden=true;sh.sugg=null;return}
  box.hidden=false;
  var amt=num($('#p-amount').value),due=$('#p-due')?$('#p-due').value:'';
  if(!(amt>0)){box.className='note';box.textContent='Escribe el monto y te sugiero cuándo pagarlo para no quedarte sin dinero.';sh.sugg=null;return}
  var r=suggestDate(state,amt,{due:due||null,excludeId:sh.id||null});
  var buffer=state.settings.buffer;
  if(!r){
    sh.sugg=null;box.className='note warn';
    box.textContent='No encuentro un día que te deje arriba de tu colchón de '+money(buffer)+'. Baja tu gasto suelto o mueve otro pago antes de agregarlo.';
    return;
  }
  sh.sugg=r.date;
  box.className='note '+(r.late?'bad':'good');
  box.innerHTML='';
  var p=document.createElement('p');
  p.textContent=r.late
    ?'Con tu plan actual no alcanza antes de que venza ('+dayLabel(due)+'). El primer día seguro es el '+dayLabel(r.date)+'. Pide una prórroga o mueve otro pago.'
    :'Págalo el '+dayLabel(r.date)+'. Desde ese día tu saldo no baja de '+money(r.low)+'.';
  box.appendChild(p);
  var b=document.createElement('button');
  b.className='btn';b.type='button';b.dataset.act='use-sugg';b.textContent='Usar el '+dayLabel(r.date);
  box.appendChild(b);
}
function savePlan(){
  if(!guard())return;
  var sh=ui.sheet,v=readPlan(),k=sh.k,title=v.title.trim();
  if(!title){showErr('Ponle un nombre.');$('#p-title').focus();return}
  var amt=k==='tarea'?0:num(v.amount);
  if(k!=='tarea'&&!(amt>0)){showErr('Escribe un monto mayor a cero.');$('#p-amount').focus();return}
  if(!v.date){showErr('Elige una fecha.');return}
  var kind=k;
  if(k==='gasto'&&sh.orig==='anticipo')kind='anticipo';
  if(k==='tarea'&&sh.orig==='hito')kind='hito';
  var catEl=$('#p-cat');
  var cat=catEl?catEl.value:(k==='deuda'?'Deudas':(sh.cat||'Otros'));
  var it=sh.id?state.plan.filter(function(x){return x.id===sh.id})[0]:null;
  if(it){
    Object.assign(it,{title:title,amount:amt,kind:kind,category:cat,date:v.date,due:k==='deuda'?(v.due||''):''});
    syncTx(it);
  }else{
    state.plan.push({id:uid(),date:v.date,title:title,amount:amt,kind:kind,category:cat,goal:false,due:k==='deuda'?(v.due||''):'',paid:false});
  }
  touch();closeSheet();renderAll();toast(it?'Plan actualizado':'Agregado al plan');
}
function delPlan(){
  if(!guard())return;
  var id=ui.sheet.id;
  state.tx=state.tx.filter(function(x){return x.planId!==id});
  state.plan=state.plan.filter(function(x){return x.id!==id});
  touch();closeSheet();renderAll();toast('Eliminado del plan');
}

/* Ajustes */
function openSettings(){
  var S=state.settings;
  ui.sheet={kind:'settings'};
  panel(head('Ajustes','save-settings','Guardar')+
    '<p class="lbl">Tu dinero</p>'+
    '<div class="field">'+
    '<div class="frow"><label for="s-start">Saldo inicial</label><input id="s-start" inputmode="decimal" value="'+esc(S.startBalance)+'"></div>'+
    '<div class="frow"><label for="s-budget">Gasto suelto por semana</label><input id="s-budget" inputmode="decimal" value="'+esc(S.weeklyBudget)+'"></div>'+
    '<div class="frow"><label for="s-buffer">Colchón mínimo</label><input id="s-buffer" inputmode="decimal" value="'+esc(S.buffer)+'"></div>'+
    '<div class="frow"><label for="s-goal">Fecha de la pedida</label><input id="s-goal" type="date" value="'+esc(S.goalDate)+'"></div></div>'+
    '<p class="hint">El saldo inicial es lo que tenías en el banco el '+esc(dayLabel(S.startDate))+'. Cada movimiento que registres se suma o se resta desde ahí. El colchón es el saldo que no quieres que baje en ningún momento.</p>'+
    '<p class="lbl">Respaldo</p>'+
    '<div class="stack"><button class="btn wide" data-act="copy-backup">Copiar respaldo</button>'+
    '<button class="btn wide" data-act="show-restore">Restaurar desde un respaldo</button></div>'+
    '<div id="restore-box" class="stack" hidden><textarea id="s-backup" aria-label="Respaldo" placeholder="Pega aquí tu respaldo"></textarea>'+
    '<button class="btn primary wide" data-act="do-restore" id="restore-go">Restaurar</button></div>'+
    '<p class="hint" id="sync-line2">'+esc(syncText())+'</p>'+
    '<p class="err" id="sheet-err" hidden></p>'+
    '<button class="btn danger wide" data-act="reset-plan">Restablecer al plan original</button>');
}
function saveSettings(){
  if(!guard())return;
  var S=state.settings;
  var goal=$('#s-goal').value;
  if(!goal){showErr('Elige la fecha de la pedida.');return}
  S.startBalance=num($('#s-start').value);
  S.weeklyBudget=num($('#s-budget').value);
  S.buffer=num($('#s-buffer').value);
  S.goalDate=goal;
  touch();closeSheet();renderAll();toast('Ajustes guardados');
}
async function copyBackup(){
  var txt=JSON.stringify(state);
  try{await navigator.clipboard.writeText(txt);toast('Respaldo copiado. Pégalo en tus notas.')}
  catch(e){
    var box=$('#restore-box'),ta=$('#s-backup'),go=$('#restore-go');
    if(box&&ta){box.hidden=false;go.hidden=true;ta.value=txt;ta.focus();ta.select()}
    toast('Copia el texto de abajo y guárdalo en tus notas.');
  }
}
function doRestore(){
  if(!guard())return;
  try{
    var s=JSON.parse($('#s-backup').value);
    if(!s||!Array.isArray(s.plan)||!Array.isArray(s.tx))throw new Error('formato');
    state=normalize(s);
    state.updatedAt=Date.now();
    persistLocal();scheduleCloud();closeSheet();renderAll();toast('Respaldo restaurado');
  }catch(e){showErr('Ese texto no parece un respaldo de Caja Mora.')}
}
function resetAll(){
  if(!guard())return;
  state=seed();state.updatedAt=Date.now();
  persistLocal();scheduleCloud();closeSheet();renderAll();toast('Plan original restablecido');
}

/* ---------- Navegación y eventos ---------- */
function showTab(t){
  ui.tab=t;
  TABS.forEach(function(n){
    $('#screen-'+n).hidden=n!==t;
    $('#tab-'+n).setAttribute('aria-current',n===t?'page':'false');
  });
}
function go(t){
  showTab(t);window.scrollTo(0,0);
  if(location.hash!=='#'+t){try{location.hash=t}catch(e){}}
}
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(TABS.indexOf(t)>=0)showTab(t)});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(act){
    case 'tab':go(v);break;
    case 'add-mov':openMov(null,v);break;
    case 'edit-mov':openMov(id);break;
    case 'range':ui.range=v;renderMov();break;
    case 'filter':ui.filter=v;renderPlan();break;
    case 'toggle-plan':if(guard())togglePlan(id);break;
    case 'edit-plan':openPlan(id);break;
    case 'add-plan':openPlan(null);break;
    case 'open-settings':openSettings();break;
    case 'close-sheet':closeSheet();break;
    case 'mov-type':{var mv=readMov();ui.sheet.type=v;ui.sheet.cat=null;drawMov(mv);break}
    case 'mov-cat':{var mv2=readMov();ui.sheet.cat=v;drawMov(mv2);break}
    case 'save-mov':saveMov();break;
    case 'del-mov':confirmTap(el,'Toca otra vez para eliminar',delMov);break;
    case 'plan-kind':{var pv=readPlan();ui.sheet.k=v;ui.sheet.cat=null;drawPlan(pv);updateSugg();break}
    case 'save-plan':savePlan();break;
    case 'del-plan':confirmTap(el,'Toca otra vez para eliminar',delPlan);break;
    case 'use-sugg':if(ui.sheet&&ui.sheet.sugg){$('#p-date').value=ui.sheet.sugg;toast('Fecha lista. Toca Guardar.')}break;
    case 'save-settings':saveSettings();break;
    case 'copy-backup':copyBackup();break;
    case 'show-restore':{var rb=$('#restore-box');rb.hidden=false;$('#restore-go').hidden=false;$('#s-backup').focus();break}
    case 'do-restore':doRestore();break;
    case 'reset-plan':confirmTap(el,'Toca otra vez: se borra todo lo registrado',resetAll);break;
  }
});
document.addEventListener('input',function(e){
  var i=e.target.id;
  if(i==='p-amount'||i==='p-due')updateSugg();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.sheet)renderAll()});

renderAll();
(function(){var t=location.hash.slice(1);showTab(TABS.indexOf(t)>=0?t:'resumen')})();
initCloud();
})();
</script>

</body></html>
